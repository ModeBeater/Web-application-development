# nginx config of the `frontend` service.
#
# 1. Serves the React build (static files from /usr/share/nginx/html).
# 2. Any other path (/l/FLT107/, /me/ ...) falls back to index.html, so the browser
#    loads the app and React Router renders the right page — a "SPA fallback".
# 3. API paths are proxied to the backend service over the Compose network, so the
#    app calls "/api/..." on its own origin: one origin, no CORS, and the backend
#    address never reaches the browser.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Backend: REST API, Swagger UI, OpenAPI schema, health check, static files of the
    # browsable API / Swagger (served by WhiteNoise inside the backend container).
    location ~ ^/(api|docs|openapi\.yaml|health|static)(/|$) {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # the address the browser used (localhost:3000, the tunnel host...)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;   # lecture material uploads (the API allows 5 MB)
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: the single-page app
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
