        username:
          type: string
          minLength: 3
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
    PatchedUserRequest:
      type: object
      description: 'Full profile: what /api/auth/me/ and the admin user list return.'
      properties:
        username:
          type: string
          minLength: 3
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    Question:
      type: object
      description: A question with its author and vote count.
      properties:
        id:
          type: integer
          readOnly: true
        lecture_id:
          type: integer
          readOnly: true
        lecture_code:
          type: string
          readOnly: true
        lecture_title:
          type: string
          readOnly: true
        topic_id:
          type: integer
          nullable: true
          description: Topic of the same lecture. Omit it and the tagging model picks
            one; null removes the tag
        topic_title:
          type: string
          readOnly: true
          nullable: true
        tag_source:
          type: string
          readOnly: true
          description: '"manual", "auto" or "" (untagged)'
        tag_score:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Model confidence 0..1 for auto tags
        text:
          type: string
          description: 1–500 characters
          maxLength: 500
        author:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        votes:
          type: integer
          readOnly: true
          default: 0
          description: Number of upvotes
        voted:
          type: boolean
          readOnly: true
          default: false
          description: Whether the caller has upvoted it
        is_answered:
          type: boolean
        answer:
          allOf:
          - $ref: '#/components/schemas/Answer'
          readOnly: true
          nullable: true
          description: The lecturer's written answer, or null
        created_at:
          type: string
          format: date-time
          readOnly: true
        can_edit:
          type: boolean
          readOnly: true
          description: Whether the caller may edit or delete it
        can_answer:
          type: boolean
          readOnly: true
          description: Whether the caller may mark it answered / write the answer
      required:
      - answer
      - author
      - can_answer
      - can_edit
      - created_at
      - id
      - lecture_code
      - lecture_id
      - lecture_title
      - tag_score
      - tag_source
      - text
      - topic_title
      - voted
      - votes
    QuestionRequest:
