  /health/:
    get:
      operationId: health
      description: Runs `SELECT version()` on PostgreSQL. Used by the Docker `HEALTHCHECK`.
      summary: Health check
      tags:
      - service
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    Answer:
      type: object
      description: The lecturer's written answer; one per question (OneToOneField).
      properties:
        id:
          type: integer
          readOnly: true
        question_id:
          type: integer
          readOnly: true
        text:
          type: string
          description: 1–2000 characters
          maxLength: 2000
        author:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - question_id
      - text
      - updated_at
    AnswerRequest:
      type: object
      description: The lecturer's written answer; one per question (OneToOneField).
      properties:
        text:
          type: string
          minLength: 1
          description: 1–2000 characters
          maxLength: 2000
      required:
      - text
    AnsweredResult:
      type: object
      properties:
        id:
          type: integer
        is_answered:
          type: boolean
      required:
      - id
      - is_answered
    ApiRoot:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        docs:
          type: string
          format: uri
        schema:
          type: string
          format: uri
        health:
          type: string
          format: uri
        stats:
          type: string
          format: uri
        auth:
          type: object
          additionalProperties:
            type: string
            format: uri
        lectures:
          type: string
          format: uri
        topics:
          type: string
          format: uri
        questions:
          type: string
          format: uri
        users:
          type: string
          format: uri
      required:
      - auth
      - docs
      - health
      - lectures
      - name
      - questions
      - schema
      - stats
      - topics
      - users
      - version
    Health:
      type: object
      properties:
        status:
          type: string
        app:
          type: string
        version:
          type: string
        database:
          type: string
        refresh_seconds:
          type: integer
          description: How often the frontend polls for new questions
      required:
      - app
      - database
      - refresh_seconds
      - status
      - version
    JoinInfo:
      type: object
      properties:
        code:
          type: string
        join_url:
          type: string
          format: uri
          description: Address students open; encoded in the QR code
        screen_url:
          type: string
          format: uri
          description: Projector page of the frontend
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          description: |-
            Where join_url came from

            * `env` - env
            * `tunnel` - tunnel
            * `frontend` - frontend
            * `request` - request
        local_only:
          type: boolean
          description: True when the address only works on this computer
        qr_svg:
          type: string
          description: Inline SVG of the QR code (viewBox, no fixed size)
      required:
      - code
      - join_url
      - local_only
      - qr_svg
      - screen_url
      - source
    Lecture:
      type: object
      description: A lecture as the API shows it. `code`, `owner`, `created_at` and
        the URLs are read-only.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          description: 3–120 characters
          maxLength: 120
        code:
          type: string
          readOnly: true
          description: 6-character join code generated by the server
        is_open:
          type: boolean
          description: Closed lectures reject new questions with 409
        owner:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        question_count:
          type: integer
          readOnly: true
        topic_count:
          type: integer
          readOnly: true
          default: 0
          description: Topics in the lecture plan
        has_material:
          type: boolean
          readOnly: true
          description: Whether lecture text was uploaded (source of auto topics)
        created_at:
          type: string
          format: date-time
          readOnly: true
        join_url:
          type: string
          format: uri
          readOnly: true
          description: Address encoded in the QR code
        screen_url:
          type: string
          format: uri
          readOnly: true
          description: Projector page
        can_manage:
          type: boolean
          readOnly: true
          description: Whether the caller may edit, close or delete it
      required:
      - can_manage
      - code
      - created_at
      - has_material
      - id
      - join_url
      - owner
      - question_count
      - screen_url
      - title
      - topic_count
    LectureDetail:
      type: object
      description: 'GET /api/lectures/{key}/: the lecture plus its topics and its
        questions in screen order.'
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          description: 3–120 characters
          maxLength: 120
        code:
          type: string
          readOnly: true
          description: 6-character join code generated by the server
        is_open:
          type: boolean
          description: Closed lectures reject new questions with 409
        owner:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        question_count:
          type: integer
          readOnly: true
        topic_count:
          type: integer
          readOnly: true
          default: 0
          description: Topics in the lecture plan
        has_material:
          type: boolean
          readOnly: true
          description: Whether lecture text was uploaded (source of auto topics)
        created_at:
          type: string
          format: date-time
          readOnly: true
        join_url:
          type: string
          format: uri
          readOnly: true
          description: Address encoded in the QR code
        screen_url:
          type: string
          format: uri
          readOnly: true
          description: Projector page
        can_manage:
          type: boolean
          readOnly: true
          description: Whether the caller may edit, close or delete it
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
          readOnly: true
      required:
      - can_manage
      - code
      - created_at
      - has_material
      - id
      - join_url
      - owner
      - question_count
      - questions
      - screen_url
      - title
      - topic_count
      - topics
    LectureRequest:
      type: object
      description: A lecture as the API shows it. `code`, `owner`, `created_at` and
        the URLs are read-only.
      properties:
        title:
          type: string
          minLength: 1
          description: 3–120 characters
          maxLength: 120
        is_open:
          type: boolean
          description: Closed lectures reject new questions with 409
      required:
      - title
    LectureSummary:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        title:
          type: string
        is_open:
          type: boolean
        questions:
          type: integer
        answered:
          type: integer
        with_written_answer:
          type: integer
        upvotes:
          type: integer
        participants:
          type: integer
        tagged_auto:
          type: integer
        tagged_manual:
          type: integer
        untagged:
          type: integer
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicStat'
      required:
      - answered
      - code
      - id
      - is_open
      - participants
      - questions
      - tagged_auto
      - tagged_manual
      - title
      - topics
      - untagged
      - upvotes
      - with_written_answer
    LoginRequest:
      type: object
      description: |-
        POST /api/auth/login/: username + password -> access + refresh tokens.

        SimpleJWT's serializer does the password check; this subclass adds the role
        and username as claims inside the token and the user profile to the response.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          description: The refresh token to revoke
      required:
      - refresh
    Material:
      type: object
      description: The uploaded lecture text. `text` is accepted as JSON or as a file
        field named `file` (txt / md / pdf).
      properties:
        id:
          type: integer
          readOnly: true
        lecture_id:
          type: integer
          readOnly: true
        title:
          type: string
          description: File name or a short label
          maxLength: 200
        text:
          type: string
          description: Plain text of the lecture
        characters:
          type: integer
          readOnly: true
        uploaded_by:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - characters
      - created_at
      - id
      - lecture_id
      - text
      - updated_at
      - uploaded_by
    MaterialRequest:
      type: object
      description: The uploaded lecture text. `text` is accepted as JSON or as a file
        field named `file` (txt / md / pdf).
      properties:
        title:
          type: string
          description: File name or a short label
          maxLength: 200
        text:
          type: string
          minLength: 1
          description: Plain text of the lecture
      required:
      - text
    MaterialUploadResult:
      type: object
      properties:
        material:
          $ref: '#/components/schemas/Material'
        topics_created:
          type: integer
        topics_updated:
          type: integer
        topics:
          type: array
          items:
