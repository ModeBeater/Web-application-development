          description: ''
        '404':
          description: No answer yet
    put:
      operationId: questions_answer_update
      description: Lecture owner or admin. Creates the answer (201) or replaces the
        existing one (200); the caller becomes its author and the question is marked
        as answered.
      summary: Write or replace the answer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this question.
        required: true
      tags:
      - questions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
          description: ''
        '403':
