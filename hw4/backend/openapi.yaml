    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - current_password
      - new_password
    PatchedLectureRequest:
      type: object
      description: A lecture as the API shows it. `code`, `owner`, `created_at` and
        the URLs are read-only.
      properties:
        title:
          type: string
          minLength: 1
          description: 3–120 characters
          maxLength: 120
        is_open:
          type: boolean
          description: Closed lectures reject new questions with 409
    PatchedQuestionRequest:
      type: object
      description: A question with its author and vote count.
      properties:
        topic_id:
          type: integer
          nullable: true
          description: Topic of the same lecture. Omit it and the tagging model picks
            one; null removes the tag
        text:
          type: string
          minLength: 1
          description: 1–500 characters
          maxLength: 500
        is_answered:
          type: boolean
    PatchedTopicRequest:
      type: object
      description: A sub-topic of a lecture. `lecture_id` comes from the URL on create
        and is read-only afterwards.
      properties:
        title:
          type: string
          minLength: 1
          description: 3–120 characters, unique within the lecture
          maxLength: 120
        keywords:
          type: string
          description: Comma-separated hints used by the tagging model
          maxLength: 300
        description:
          type: string
          description: What the topic covers; the section text when extracted from
            the material
        order:
          type: integer
          maximum: 32767
          minimum: 0
          description: Position in the lecture plan
    PatchedUserAdminRequest:
      type: object
      description: Admins may also change the role and (de)activate accounts.
