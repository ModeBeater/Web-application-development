openapi: 3.0.3
info:
  title: Raise Hand API
  version: '3.0'
  description: |-
    Live Q&A for lectures: a lecturer starts a **lecture**, the audience scans a QR code, asks **questions** and upvotes the ones they also want answered.

    Built with Django REST Framework: serializers validate input, viewsets implement list / retrieve / create / update / delete, django-filter and DRF filters add `?is_open=`, `?search=`, `?ordering=`, and every list is paginated with `?limit=&offset=`.

    **Authentication**: JWT. `POST /api/auth/login/` returns an `access` token (15 min) and a `refresh` token (7 days). Send `Authorization: Bearer <access>`; when it expires, `POST /api/auth/refresh/` with the refresh token returns a new pair (the old refresh token is revoked). Reading is public; writing needs a user. **Roles**: `student` asks and upvotes, `lecturer` also creates and manages own lectures, `admin` manages everything and the users.

    A lecture can be addressed by its numeric id or its 6-character join code.
  contact:
    name: Course repository
    url: https://github.com/ModeBeater/Web-application-development
paths:
  /api/:
    get:
      operationId: api_root
      description: Version number and links to everything.
      summary: API root
      tags:
      - service
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Username + password → `access` (15 min) and `refresh` (7 days)
        tokens plus the user profile. Send `Authorization: Bearer <access>` with every
        request.'
      summary: Login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          description: Wrong username or password
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revokes the given refresh token (adds it to the blacklist). The
        access token stays valid until it expires, which is why access tokens are
        short-lived.
      summary: Logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: Refresh token revoked
        '400':
          description: Invalid token
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The signed-in user with activity counters.
      summary: My profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Change username, first/last name or email. The username must stay
        unique.
      summary: Edit my profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/me/password/:
    post:
      operationId: auth_me_password_create
      description: Checks the current password, applies the validators to the new
        one and returns a fresh token pair.
      summary: Change my password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Exchanges a refresh token for a new access **and** refresh token.
        The old refresh token is blacklisted (rotation), so each refresh token can
        be used once.
      summary: Refresh tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          description: Token is invalid, expired or revoked
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: 'Creates a student or lecturer account and signs it in: the response
        carries a token pair.'
      summary: Register
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          description: Validation errors per field
  /api/lectures/:
    get:
      operationId: lectures_list
      description: Newest first, each with its owner, number of questions and topics.
        `?owner=me` for mine.
      summary: List lectures
      parameters:
      - in: query
        name: is_open
        schema:
          type: boolean
        description: Only open (true) or only closed (false) lectures
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner
        schema:
          type: string
        description: Owner user id, or `me`
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - lectures
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLectureList'
          description: ''
    post:
      operationId: lectures_create
      description: Lecturers and admins only. The caller becomes the owner; a random
        join code is generated.
      summary: Create a lecture
      tags:
      - lectures
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LectureRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LectureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LectureRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecture'
          description: ''
        '401':
          description: No or invalid access token
        '403':
          description: Signed in, but the role or ownership rules forbid it
  /api/lectures/{key}/:
    get:
      operationId: lectures_retrieve
      description: The lecture with its topic plan and its questions in screen order
        (most upvoted first, answered last).
      summary: Get a lecture by id or code
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureDetail'
          description: ''
    put:
      operationId: lectures_update
      description: CRUD for lectures. The router maps list/create/retrieve/update/partial_update/destroy
        to URLs.
      summary: Replace a lecture (PUT)
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LectureRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LectureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LectureRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecture'
          description: ''
        '403':
          description: Signed in, but the role or ownership rules forbid it
    patch:
      operationId: lectures_partial_update
      description: CRUD for lectures. The router maps list/create/retrieve/update/partial_update/destroy
        to URLs.
      summary: Update part of a lecture (PATCH)
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLectureRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLectureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLectureRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecture'
          description: ''
        '403':
          description: Signed in, but the role or ownership rules forbid it
    delete:
      operationId: lectures_destroy
      description: Owner or admin. Its topics, material, questions, upvotes and answers
        are removed by cascade.
      summary: Delete a lecture
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Signed in, but the role or ownership rules forbid it
  /api/lectures/{key}/export/:
    get:
      operationId: lectures_export_retrieve
      description: Topics, questions (with votes and authors) and written answers
        as a Markdown document — to send to the audience after the lecture.
      summary: Export the lecture as Markdown
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      responses:
        '200':
          content:
            text/markdown:
              schema:
                type: string
          description: ''
  /api/lectures/{key}/join/:
    get:
      operationId: lectures_join_retrieve
      description: 'What the projector page shows: the address students open (QR code
        as inline SVG), the join code and where that address came from — `env` (PUBLIC_URL),
        `tunnel` (running cloudflared), `frontend` (FRONTEND_URL) or `request` (the
        address this request came through). `local_only` warns that the address only
        works on this computer (localhost).'
      summary: Join link and QR code
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinInfo'
          description: ''
  /api/lectures/{key}/material/:
    get:
      operationId: lectures_material_retrieve
      description: CRUD for lectures. The router maps list/create/retrieve/update/partial_update/destroy
        to URLs.
      summary: Get the uploaded lecture material
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
          description: ''
        '404':
          description: Nothing uploaded yet
    post:
      operationId: lectures_material_create
      description: 'Owner or admin. Either JSON `{"title": "...", "text": "..."}`
        or multipart with a `file` (.txt, .md or .pdf, up to 5 MB). Replaces the previous
        material (one per lecture). Unless `extract=false`, headings become topics
        (existing titles are updated, the lecturer''s own topics are kept), each topic
        gets TF-IDF keywords, and the lecture''s questions are re-tagged.'
      summary: Upload the lecture text and build the topic plan
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialUploadResult'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialUploadResult'
          description: ''
        '400':
          description: Empty or too large
        '403':
          description: Signed in, but the role or ownership rules forbid it
    delete:
      operationId: lectures_material_destroy
      description: Owner or admin. The topics built from it stay.
      summary: Delete the lecture material
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Signed in, but the role or ownership rules forbid it
        '404':
          description: Nothing uploaded
  /api/lectures/{key}/questions/:
    get:
      operationId: lectures_questions_list
      description: 'Ordered like the screen: most upvoted first, answered ones last.
        Paginated.'
      summary: List questions of a lecture
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - lectures
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuestionList'
          description: ''
    post:
      operationId: lectures_questions_create
      description: 'Any signed-in user. The caller becomes the author. Send `topic_id`
        to tag the question yourself (`tag_source: manual`); leave it out and the
        tagging model suggests a topic (`tag_source: auto`, with `tag_score`) or leaves
        the question untagged. 409 if the lecture is closed.'
      summary: Ask a question (create)
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
          description: ''
        '401':
          description: No or invalid access token
        '409':
          description: Lecture closed
  /api/lectures/{key}/retag/:
    post:
      operationId: lectures_retag_create
      description: Owner or admin. Runs the tagging model again over the lecture's
        questions — after the topic plan changed. Manual tags are kept unless `?include_manual=true`.
      summary: Re-tag the questions of a lecture
      parameters:
      - in: query
        name: include_manual
        schema:
          type: boolean
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetagResult'
          description: ''
        '403':
          description: Signed in, but the role or ownership rules forbid it
  /api/lectures/{key}/similar/:
    get:
      operationId: lectures_similar_list
      description: Existing questions of this lecture that look like `text`, best
        first — shown to a student before they post a duplicate. Char n-gram TF-IDF
        cosine similarity above `SIMILAR_THRESHOLD`.
      summary: Similar questions (while typing)
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: text
        schema:
          type: string
        description: The question text being typed
        required: true
      tags:
      - lectures
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSimilarQuestionList'
          description: ''
  /api/lectures/{key}/suggest/:
    get:
      operationId: lectures_suggest_retrieve
      description: What topic the tagging model would assign to `text`, with the score
        for every topic. Nothing is stored — the frontend shows it next to the question
        field.
      summary: Preview the automatic tag
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      - in: query
        name: text
        schema:
          type: string
        description: The question text being typed
        required: true
      tags:
      - lectures
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagSuggestion'
          description: ''
  /api/lectures/{key}/summary/:
    get:
      operationId: lectures_summary_retrieve
      description: 'Totals and a per-topic breakdown (questions, answered, upvotes)
        — what the lecturer looks at after the lecture. The `topics` list ends with
        the untagged bucket (`id: null`).'
      summary: Lecture summary
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LectureSummary'
          description: ''
  /api/lectures/{key}/toggle/:
    post:
      operationId: lectures_toggle_create
      description: Owner or admin. Flips `is_open`; a closed lecture rejects new questions
        with 409.
      summary: Open / close a lecture
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleResult'
          description: ''
        '403':
          description: Signed in, but the role or ownership rules forbid it
  /api/lectures/{key}/topics/:
    get:
      operationId: lectures_topics_list
      description: 'The lecture plan: topics in order, each with its number of tagged
        questions.'
      summary: List topics of a lecture
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - lectures
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTopicList'
          description: ''
    post:
      operationId: lectures_topics_create
      description: Owner or admin. One lecture has many topics (one-to-many); the
        title is unique within the lecture.
      summary: Add a topic to a lecture
      parameters:
      - in: path
        name: key
        schema:
          type: string
        description: Lecture id (`12`) or join code (`KBTU26`, case-insensitive)
        required: true
      tags:
      - lectures
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TopicRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TopicRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
          description: ''
        '401':
          description: No or invalid access token
        '403':
          description: Signed in, but the role or ownership rules forbid it
  /api/questions/:
    get:
      operationId: questions_list
      description: Every question, newest first. Filter with `?lecture=`, `?topic=`,
        `?is_answered=`, `?has_answer=`, `?tag_source=manual|auto|none`, `?author=me`,
        `?search=`, sort with `?ordering=votes|-votes|created_at`, page with `?limit=&offset=`.
      summary: List all questions
      parameters:
      - in: query
        name: author
        schema:
          type: string
        description: Author user id, or `me`
      - in: query
        name: has_answer
        schema:
          type: boolean
        description: true = only questions with a written answer, false = without
          one
      - in: query
        name: is_answered
        schema:
          type: boolean
        description: Only answered (true) or only open (false) questions
      - in: query
        name: lecture
        schema:
          type: string
        description: Lecture id or join code
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: tag_source
        schema:
          type: string
          enum:
          - auto
          - manual
          - none
        description: |-
          How the topic was assigned: manual, auto, or none (untagged)

          * `manual` - manual
          * `auto` - auto
          * `none` - none
      - in: query
        name: topic
